apiVersion: v1
kind: Namespace
metadata:
  name: grok-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grok-readonly
  namespace: grok-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grok-readonly-sre
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - namespaces
      - nodes
      - events
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - limitranges
      - serviceaccounts
      - replicationcontrollers
    verbs: ["get", "list", "watch"]

  # Apps
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Batch (Job/CronJob - hữu ích cho Airflow/NiFi troubleshoot)
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  # Metrics (cần metrics-server cài sẵn trên cluster để dùng `kubectl top`)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]

  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]

  # RBAC introspection (chỉ đọc, KHÔNG cho sửa quyền)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list"]

  # KHÔNG cấp: apply/create/delete/patch/edit/replace/scale
  # KHÔNG cấp: pods/exec, pods/attach, pods/portforward
  # KHÔNG cấp: secrets (xem ghi chú trong SETUP.md)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grok-readonly-sre
subjects:
  - kind: ServiceAccount
    name: grok-readonly
    namespace: grok-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grok-readonly-sre
